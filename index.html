<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1a1a">
    <title>دبیرستان شهید حسن باقری</title>

    <!-- فونت وزیرمتن -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        body {
            /* پس‌زمینه تیره ملایم با گرادیان رنگی - نه مشکی خالص */
            background: #14141a;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(184, 134, 11, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(100, 90, 60, 0.15) 0%, transparent 60%),
                linear-gradient(135deg, #14141a 0%, #1a1a22 50%, #14141a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* حباب‌های شیشه‌ای پس‌زمینه */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #d4af37;
            top: -180px;
            right: -150px;
            animation: float1 18s ease-in-out infinite;
        }

        body::after {
            width: 350px;
            height: 350px;
            background: #b8860b;
            bottom: -150px;
            left: -120px;
            animation: float2 22s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 40px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -30px); }
        }

        /* کارت شیشه‌ای اصلی */
        .container {
            position: relative;
            z-index: 1;
            /* شیشه‌ای واقعی */
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            /* حاشیه زرد ملایم */
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 24px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            padding: 40px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* درخشش ملایم بالای کارت */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.6), transparent);
            border-radius: 50%;
        }

        /* لوگو */
        .logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            /* حاشیه زرد ملایم */
            border: 2px solid rgba(212, 175, 55, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo:hover,
        .logo:active {
            border-color: rgba(212, 175, 55, 0.55);
            transform: scale(1.03);
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-placeholder {
            font-size: 50px;
            color: #d4af37;
        }

        /* تیتر */
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            /* رنگ زرد ملایم */
            color: #e8d9a8;
            text-shadow: 0 1px 8px rgba(212, 175, 55, 0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 300;
            margin-bottom: 28px;
            letter-spacing: 0.3px;
        }

        /* خط جداکننده */
        .divider {
            width: 50px;
            height: 1px;
            margin: 0 auto 28px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
            position: relative;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 5px;
            height: 5px;
            background: rgba(212, 175, 55, 0.7);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(20, 20, 26, 1);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* دکمه‌های شیشه‌ای */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-size: 15.5px;
            font-weight: 500;
            /* شیشه‌ای */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            /* حاشیه زرد ملایم */
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* افکت درخشش روی دکمه */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
            transition: left 0.7s ease;
        }

        .btn:hover::before,
        .btn:active::before {
            left: 100%;
        }

        .btn:hover,
        .btn:active {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateY(-3px);
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(212, 175, 55, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* آیکون دکمه */
        .btn-icon {
            font-size: 20px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* شیشه‌ای */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            /* حاشیه زرد ملایم */
            border: 1px solid rgba(212, 175, 55, 0.3);
            flex-shrink: 0;
            transition: all 0.35s ease;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .btn:hover .btn-icon,
        .btn:active .btn-icon {
            background: rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.55);
            transform: scale(1.06);
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: right;
            flex: 1;
            min-width: 0;
        }

        .btn-text > span:first-child {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .btn-text small {
            font-size: 11px;
            font-weight: 300;
            color: rgba(212, 175, 55, 0.6);
            margin-top: 3px;
            transition: color 0.3s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .btn:hover .btn-text small,
        .btn:active .btn-text small {
            color: rgba(212, 175, 55, 0.85);
        }

        /* فلش */
        .btn-arrow {
            color: rgba(212, 175, 55, 0.4);
            font-size: 18px;
            transition: all 0.35s ease;
            flex-shrink: 0;
        }

        .btn:hover .btn-arrow,
        .btn:active .btn-arrow {
            color: rgba(212, 175, 55, 0.9);
            transform: translateX(-4px);
        }

        /* فوتر */
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.12);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.3px;
            font-weight: 300;
        }

        .footer .credit strong {
            color: rgba(232, 217, 168, 0.75);
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer .credit strong:hover {
            color: #e8d9a8;
        }

        /* ========== بهینه‌سازی موبایل ========== */
        @media (max-width: 520px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 24px;
                padding-bottom: 24px;
            }

            .container {
                padding: 32px 22px;
                border-radius: 22px;
                max-width: 100%;
            }

            .logo {
                width: 95px;
                height: 95px;
                margin-bottom: 18px;
            }

            .logo-placeholder {
                font-size: 42px;
            }

            h1 {
                font-size: 20px;
                margin-bottom: 6px;
            }

            .subtitle {
                font-size: 12px;
                margin-bottom: 24px;
            }

            .divider {
                margin-bottom: 24px;
            }

            .btn {
                font-size: 14px;
                padding: 14px 16px;
                gap: 12px;
                border-radius: 14px;
            }

            .btn-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
                border-radius: 10px;
            }

            .btn-text small {
                font-size: 10px;
            }

            .btn-arrow {
                font-size: 16px;
            }

            .footer {
                margin-top: 24px;
                padding-top: 16px;
                font-size: 11px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 26px 16px;
            }

            h1 {
                font-size: 18px;
            }

            .btn {
                font-size: 13px;
                padding: 12px 14px;
            }

            .btn-icon {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .btn-text small {
                font-size: 9.5px;
            }
        }

        /* حالت افقی روی موبایل */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 16px;
            }

            .container {
                padding: 24px 28px;
            }

            .logo {
                width: 70px;
                height: 70px;
                margin-bottom: 12px;
            }

            h1 {
                font-size: 18px;
            }

            .subtitle {
                margin-bottom: 16px;
            }

            .divider {
                margin-bottom: 16px;
            }

            .btn {
                padding: 12px 18px;
            }
        }

        /* پشتیبانی از دستگاه‌های با ناچ */
        @supports (padding: max(0px)) {
            body {
                padding-left: max(12px, env(safe-area-inset-left));
                padding-right: max(12px, env(safe-area-inset-right));
            }
        }

        /* کاهش انیمیشن برای کاربرانی که ترجیح می‌دهند */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="assets/logo.jpg" alt="لوگو"
                 onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=\'logo-placeholder\'>🎓</span>';">
        </div>

        <h1>دبیرستان شهید حسن باقری</h1>
        <p class="subtitle">دسترسی سریع به سامانه‌ها و خدمات مدرسه</p>
        <div class="divider"></div>

        <div class="buttons">
            <a href="https://ir4din.github.io/Search/" class="btn" target="_blank" rel="noopener">
                <span class="btn-icon">👨‍🎓</span>
                <span class="btn-text">
                    <span>استعلام کلاس‌های دانش‌آموزان</span>
                    <small>مشاهده برنامه و کلاس‌ها</small>
                </span>
                <span class="btn-arrow">←</span>
            </a>

            <a href="https://3di-io.github.io/BagheriSchedule/" class="btn" target="_blank" rel="noopener">
                <span class="btn-icon">👨‍🏫</span>
                <span class="btn-text">
                    <span>سامانه استعلام کلاسی اساتید</span>
                    <small>ورود به پنل اساتید</small>
                </span>
                <span class="btn-arrow">←</span>
            </a>
        </div>

        <div class="footer">
            <span class="credit">طراحی و توسعه توسط <strong>تیم پشتیبانی شهید حسن باقری</strong></span>
        </div>
    </div>

</body>
</html>
