<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دبیرستان شهید حسن باقری</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #000000;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(184, 134, 11, 0.08) 0%, transparent 65%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* حباب‌های نورانی طلایی */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.35;
            z-index: 0;
        }

        body::before {
            width: 450px;
            height: 450px;
            background: #d4af37;
            top: -180px;
            right: -120px;
            animation: float1 14s ease-in-out infinite;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: #b8860b;
            bottom: -150px;
            left: -120px;
            animation: float2 18s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, 60px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(60px, -50px); }
        }

        /* کارت اصلی - مشکی با حاشیه طلایی درخشان */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(212, 175, 55, 0.6);
            border-radius: 28px;
            box-shadow:
                0 0 0 1px rgba(212, 175, 55, 0.2),
                0 25px 60px rgba(0, 0, 0, 0.9),
                0 0 60px rgba(212, 175, 55, 0.25),
                inset 0 1px 0 rgba(212, 175, 55, 0.3);
            padding: 45px 35px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* درخشش طلایی بالای کارت */
        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
        }

        /* درخشش طلایی پایین کارت */
        .container::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }

        /* لوگو */
        .logo {
            width: 130px;
            height: 130px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            border: 3px solid rgba(212, 175, 55, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 30px rgba(212, 175, 55, 0.5),
                0 0 60px rgba(212, 175, 55, 0.2),
                inset 0 0 20px rgba(212, 175, 55, 0.15);
            overflow: hidden;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .logo:hover {
            transform: scale(1.06);
            box-shadow:
                0 0 40px rgba(212, 175, 55, 0.8),
                0 0 80px rgba(212, 175, 55, 0.4),
                inset 0 0 25px rgba(212, 175, 55, 0.25);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-placeholder {
            font-size: 60px;
            color: #d4af37;
            text-shadow: 0 0 25px rgba(212, 175, 55, 0.9);
        }

        /* تیتر با گرادیان طلایی */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #b8860b, #ffd700, #d4af37, #ffd700, #b8860b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 4s linear infinite;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle {
            color: rgba(212, 175, 55, 0.7);
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        /* خط جداکننده طلایی */
        .divider {
            width: 80px;
            height: 2px;
            margin: 0 auto 30px;
            background: linear-gradient(90deg, transparent, #d4af37, #ffd700, #d4af37, transparent);
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
            position: relative;
        }

        .divider::after {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 12px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.9);
            background: #0a0a0a;
            padding: 0 8px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* دکمه‌های مشکی با حاشیه طلایی */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            padding: 18px 24px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(212, 175, 55, 0.5);
            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(212, 175, 55, 0.15),
                inset 0 0 15px rgba(212, 175, 55, 0.05);
            transition: all 0.35s ease;
            overflow: hidden;
        }

        /* افکت درخشش طلایی روی دکمه */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-4px);
            border-color: #ffd700;
            background: rgba(20, 15, 0, 0.95);
            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.8),
                0 0 35px rgba(212, 175, 55, 0.5),
                inset 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* آیکون دکمه با حاشیه طلایی */
        .btn-icon {
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.6);
            flex-shrink: 0;
            transition: all 0.35s ease;
            box-shadow:
                0 0 15px rgba(212, 175, 55, 0.3),
                inset 0 0 10px rgba(212, 175, 55, 0.1);
        }

        .btn:hover .btn-icon {
            transform: scale(1.1) rotate(-5deg);
            background: rgba(212, 175, 55, 0.25);
            border-color: #ffd700;
            box-shadow:
                0 0 30px rgba(255, 215, 0, 0.7),
                inset 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: right;
        }

        .btn-text small {
            font-size: 11px;
            font-weight: 400;
            color: rgba(212, 175, 55, 0.75);
            margin-top: 3px;
        }

        /* فوتر با حاشیه طلایی */
        .footer {
            margin-top: 32px;
            padding-top: 22px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            font-size: 13px;
            letter-spacing: 0.4px;
            line-height: 1.8;
            position: relative;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
        }

        .footer .credit {
            display: block;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .footer .credit strong {
            background: linear-gradient(90deg, #b8860b, #ffd700, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.5));
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px 20px;
                border-radius: 22px;
            }
            h1 {
                font-size: 22px;
            }
            .logo {
                width: 100px;
                height: 100px;
            }
            .btn {
                font-size: 15px;
                padding: 15px 16px;
            }
            .btn-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوگو -->
        <div class="logo">
            <img src="assets/logo.jpg" alt="لوگو"
                 onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=\'logo-placeholder\'>🎓</span>';">
        </div>

        <!-- تیتر طلایی -->
        <h1>دبیرستان شهید حسن باقری</h1>
        <p class="subtitle">دسترسی سریع به سامانه‌ها و خدمات مدرسه</p>
        <div class="divider"></div>

        <!-- دکمه‌ها -->
        <div class="buttons">
            <a href="https://example.com/students" class="btn btn-students" target="_blank">
                <span class="btn-icon">👨‍🎓</span>
                <span class="btn-text">
                    استعلام کلاس‌های دانش‌آموزان
                    <small>مشاهده برنامه و کلاس‌ها</small>
                </span>
            </a>

            <a href="https://example.com/teachers" class="btn btn-teachers" target="_blank">
                <span class="btn-icon">👨‍🏫</span>
                <span class="btn-text">
                    سامانه استعلام کلاسی اساتید
                    <small>ورود به پنل اساتید</small>
                </span>
            </a>
        </div>

        <!-- فوتر -->
        <div class="footer">
            <span class="credit">طراحی و توسعه توسط <strong>تیم پشتیبانی شهید حسن باقری</strong></span>
        </div>
    </div>

</body>
</html>
