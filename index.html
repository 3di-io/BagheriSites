<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دبیرستان شهید حسن باقری</title>

    <!-- فونت وزیرمتن -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0a0a;
            background-image:
                radial-gradient(circle at 20% 25%, rgba(180, 155, 90, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 75%, rgba(160, 140, 80, 0.03) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* حباب‌های خیلی ملایم پس‌زمینه */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.08;
            z-index: 0;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: #b49b5a;
            top: -200px;
            right: -150px;
            animation: float1 22s ease-in-out infinite;
        }

        body::after {
            width: 450px;
            height: 450px;
            background: #a08c50;
            bottom: -180px;
            left: -150px;
            animation: float2 26s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-40px, 50px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, -40px); }
        }

        /* کارت اصلی */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(16, 16, 16, 0.75);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            /* حاشیه طلایی بسیار ملایم */
            border: 1px solid rgba(180, 155, 90, 0.15);
            border-radius: 24px;
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            padding: 50px 40px;
            max-width: 560px;
            width: 100%;
            text-align: center;
        }

        /* خط طلایی خیلی کمرنگ بالای کارت */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 45%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(180, 155, 90, 0.3), transparent);
        }

        /* لوگو */
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(20, 20, 20, 0.6);
            /* حاشیه طلایی ملایم */
            border: 1px solid rgba(180, 155, 90, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: all 0.5s ease;
        }

        .logo:hover {
            border-color: rgba(180, 155, 90, 0.35);
            transform: scale(1.02);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .logo-placeholder {
            font-size: 55px;
            color: #b49b5a;
        }

        /* تیتر */
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
            color: #d4c49a;
        }

        .subtitle {
            color: rgba(200, 185, 150, 0.4);
            font-size: 13.5px;
            font-weight: 300;
            margin-bottom: 34px;
            letter-spacing: 0.3px;
        }

        /* خط جداکننده ساده */
        .divider {
            width: 40px;
            height: 1px;
            margin: 0 auto 34px;
            background: linear-gradient(90deg, transparent, rgba(180, 155, 90, 0.35), transparent);
            position: relative;
        }

        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(180, 155, 90, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(16, 16, 16, 1);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* دکمه‌ها - حاشیه طلایی خیلی ملایم */
        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            padding: 18px 22px;
            border-radius: 14px;
            text-decoration: none;
            color: #e8e4d8;
            font-size: 16px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.02);
            /* حاشیه طلایی بسیار کمرنگ */
            border: 1px solid rgba(180, 155, 90, 0.12);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        /* خط طلایی ظریف سمت راست دکمه */
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            width: 2px;
            height: 0;
            background: rgba(180, 155, 90, 0.7);
            border-radius: 2px 0 0 2px;
            transition: height 0.4s ease;
        }

        .btn:hover::after {
            height: 45%;
        }

        .btn:hover {
            background: rgba(180, 155, 90, 0.05);
            /* حاشیه کمی پررنگ‌تر ولی هنوز ملایم */
            border-color: rgba(180, 155, 90, 0.25);
            transform: translateX(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .btn:active {
            transform: translateX(-2px);
        }

        /* آیکون دکمه */
        .btn-icon {
            font-size: 22px;
            width: 46px;
            height: 46px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(180, 155, 90, 0.05);
            /* حاشیه خیلی ملایم */
            border: 1px solid rgba(180, 155, 90, 0.15);
            flex-shrink: 0;
            transition: all 0.4s ease;
        }

        .btn:hover .btn-icon {
            background: rgba(180, 155, 90, 0.1);
            border-color: rgba(180, 155, 90, 0.28);
            transform: scale(1.05);
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: right;
            flex: 1;
        }

        .btn-text small {
            font-size: 11.5px;
            font-weight: 300;
            color: rgba(200, 185, 150, 0.35);
            margin-top: 4px;
            transition: color 0.3s ease;
        }

        .btn:hover .btn-text small {
            color: rgba(200, 185, 150, 0.6);
        }

        /* فلش کوچک */
        .btn-arrow {
            color: rgba(180, 155, 90, 0.25);
            font-size: 18px;
            transition: all 0.4s ease;
            margin-right: auto;
        }

        .btn:hover .btn-arrow {
            color: rgba(180, 155, 90, 0.7);
            transform: translateX(-4px);
        }

        /* فوتر */
        .footer {
            margin-top: 38px;
            padding-top: 24px;
            /* خط جداکننده بسیار ملایم */
            border-top: 1px solid rgba(180, 155, 90, 0.08);
            font-size: 12.5px;
            color: rgba(200, 185, 150, 0.3);
            letter-spacing: 0.3px;
            font-weight: 300;
        }

        .footer .credit strong {
            color: rgba(212, 196, 154, 0.7);
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .footer .credit strong:hover {
            color: #d4c49a;
        }

        @media (max-width: 480px) {
            .container {
                padding: 38px 24px;
                border-radius: 20px;
            }
            h1 {
                font-size: 21px;
            }
            .logo {
                width: 100px;
                height: 100px;
            }
            .btn {
                font-size: 14.5px;
                padding: 15px 18px;
                gap: 12px;
            }
            .btn-icon {
                width: 42px;
                height: 42px;
                font-size: 20px;
            }
            .btn-text small {
                font-size: 10.5px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <img src="assets/logo.jpg" alt="لوگو"
                 onerror="this.style.display='none'; this.parentNode.innerHTML='<span class=\'logo-placeholder\'>🎓</span>';">
        </div>

        <h1>دبیرستان شهید حسن باقری</h1>
        <p class="subtitle">دسترسی سریع به سامانه‌ها و خدمات مدرسه</p>
        <div class="divider"></div>

        <div class="buttons">
            <a href="https://ir4din.github.io/Search/" class="btn" target="_blank">
                <span class="btn-icon">👨‍🎓</span>
                <span class="btn-text">
                    استعلام کلاس‌های دانش‌آموزان
                    <small>مشاهده برنامه و کلاس‌ها</small>
                </span>
                <span class="btn-arrow">←</span>
            </a>

            <a href="https://3di-io.github.io/BagheriSchedule/" class="btn" target="_blank">
                <span class="btn-icon">👨‍🏫</span>
                <span class="btn-text">
                    سامانه استعلام کلاسی اساتید
                    <small>ورود به پنل اساتید</small>
                </span>
                <span class="btn-arrow">←</span>
            </a>
        </div>

        <div class="footer">
            <span class="credit">طراحی و توسعه توسط <strong>تیم پشتیبانی شهید حسن باقری</strong></span>
        </div>
    </div>

</body>
</html>
